name: Allama Absolute CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-audit
          path: completion-audit.generated.json
